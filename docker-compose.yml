# One-command spin-up for collaborators (native local dev with psql + uv + npm
# remains the primary workflow). Default `docker compose up` starts postgres +
# core + admin. Channel gateways need credentials, so each is behind a profile:
#   docker compose --profile gateway up    # all channel gateways
#   docker compose --profile whatsapp up   # just WhatsApp Cloud API (needs ./whatsapp/.env)
#   docker compose --env-file whatsapp-waha/.env --profile whatsapp-waha up --build  # WhatsApp via WAHA/GOWS
#   docker compose --profile telegram up   # just Telegram (needs ./telegram/.env)
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aaba10a8b7
    ports:
      # 5432 is often taken by a host Postgres install; core uses the
      # internal service port, so only the host-side mapping changes.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./core/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chasqui"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Media storage (ADR-003) — local S3-compatible bucket, zero setup.
  # RustFS (Apache-2.0; MinIO was archived/relicensed in 2026 — see ADR-003).
  # Console at http://localhost:9001 (chasqui / chasqui-secret).
  # Dev/test only: production points STORAGE_* at a managed bucket (S3/R2/B2).
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: chasqui
      RUSTFS_SECRET_KEY: chasqui-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storagedata:/data

  # One-shot: creates the media bucket so `up` is all collaborators need
  # (retries until the storage service accepts connections).
  storage-init:
    image: amazon/aws-cli
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: chasqui
      AWS_SECRET_ACCESS_KEY: chasqui-secret
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://storage:9000 s3api head-bucket --bucket chasqui-media 2>/dev/null ||
            aws --endpoint-url http://storage:9000 s3 mb s3://chasqui-media; do sleep 2; done;
      echo bucket ready"

  core:
    build: ./core
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    env_file:
      - ./core/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chasqui
      CORS_ORIGINS: "http://localhost:3000"
      # Media storage (ADR-003): core uploads via the docker network, but
      # presigned URLs must be browser-reachable → public endpoint override.
      STORAGE_ENDPOINT_URL: "http://storage:9000"
      STORAGE_PUBLIC_ENDPOINT_URL: "http://localhost:9000"
      STORAGE_BUCKET: chasqui-media
      STORAGE_ACCESS_KEY: chasqui
      STORAGE_SECRET_KEY: chasqui-secret
      # Outbound seam (ADR-004): where operator replies go. Only resolvable
      # when the matching gateway profile is up; sends fail with a clear error
      # otherwise.
      CHANNEL_WHATSAPP_SEND_URL: "http://whatsapp:8000/send"
      CHANNEL_WHATSAPP_WAHA_SEND_URL: "http://whatsapp-waha:8003/send"
      CHANNEL_TELEGRAM_SEND_URL: "http://telegram:8001/send"
    command: sh -c "alembic upgrade head && gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8090"
    ports:
      # Override CORE_HOST_PORT if a local `make dev` core already uses 8090.
      - "${CORE_HOST_PORT:-8090}:8090"

  admin:
    build:
      context: ./admin
    depends_on:
      - core
    ports:
      - "3000:3000"

  whatsapp:
    build: ./whatsapp
    profiles: ["gateway", "whatsapp"]
    depends_on:
      - core
    env_file:
      - ./whatsapp/.env
    environment:
      CORE_URL: "http://core:8090"
      INTERNAL_API_KEY: devkey
    ports:
      - "8000:8000"

  # Self-hosted WhatsApp via WAHA (GOWS engine — no Chromium).
  # Pinned image: GOWS builds are tagged separately from the default engine.
  # Dashboard/QR: http://localhost:3001/dashboard (admin / ${WAHA_DASHBOARD_PASSWORD})
  waha:
    image: devlikeapro/waha:gows-2026.10.1
    profiles: ["gateway", "whatsapp-waha"]
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-dev-waha-dashboard}
      WAHA_BASE_URL: "http://waha:3000"
    ports:
      - "3001:3000"
    volumes:
      - wahasessions:/app/.sessions

  whatsapp-waha:
    build: ./whatsapp-waha
    profiles: ["gateway", "whatsapp-waha"]
    depends_on:
      - core
      - waha
    env_file:
      - ./whatsapp-waha/.env
    environment:
      CORE_URL: "http://core:8090"
      WAHA_BASE_URL: "http://waha:3000"
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key}
      WAHA_WEBHOOK_URL: "http://whatsapp-waha:8003/webhook"
      WAHA_WEBHOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:-dev-waha-hmac}
      WAHA_DEDUP_DB_PATH: "/app/data/dedup.sqlite3"
    ports:
      - "8003:8003"
    volumes:
      - wahadedup:/app/data

  telegram:
    build: ./telegram
    profiles: ["gateway", "telegram"]
    depends_on:
      - core
    env_file:
      - ./telegram/.env
    environment:
      CORE_URL: "http://core:8090"
      INTERNAL_API_KEY: devkey
    ports:
      - "8001:8001"

  web:
    build: ./web
    profiles: ["gateway", "web"]
    depends_on:
      - core
    env_file:
      - ./web/.env
    environment:
      CORE_URL: "http://core:8090"
      INTERNAL_API_KEY: devkey
      WEB_ALLOWED_ORIGINS: "http://localhost:8002"
    ports:
      - "8002:8002"

volumes:
  pgdata:
  storagedata:
  wahasessions:
  wahadedup:
